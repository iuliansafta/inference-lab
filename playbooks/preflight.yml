---
# Configuration checks that run on the controller only, so a broken or
# unreachable host still gets a configuration verdict first.
- name: Preflight configuration checks
  hosts: lab
  gather_facts: false
  become: false

  tasks:
    - name: Require every component to be pinned to an exact release
      ansible.builtin.assert:
        that:
          - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
          - helm_version is match('^v3\.[0-9]+\.[0-9]+$')
          - vllm_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
          - kubernetes_client_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
          - nvidia_device_plugin_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
          - dcgm_exporter_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
          - kube_prometheus_stack_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: Pin every component to an exact release in inventory/group_vars/all.yml.

    - name: Require a known variant
      ansible.builtin.assert:
        that:
          - vllm_variant in vllm_variants
        fail_msg: "VARIANT={{ vllm_variant }} is not one of {{ vllm_variants.keys() | list }}."

    - name: Require the SSH public key that Terraform registered
      ansible.builtin.assert:
        that:
          - (inventory_dir ~ '/../keys/lab.pub') is file
        fail_msg: Put the public half of your SSH key in keys/lab.pub (see README).

    - name: Require a provisioned instance
      ansible.builtin.assert:
        that:
          - ansible_host is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: Terraform has no public_ip output. Run `make infra` first.
