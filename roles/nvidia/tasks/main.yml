---
# The Scaleway GPU image ships the driver. Installing one is out of scope, so a
# missing or broken driver stops the run here.
- name: Require a working NVIDIA driver
  ansible.builtin.command: nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader
  register: nvidia_smi
  changed_when: false

- name: Show the GPU
  ansible.builtin.debug:
    msg: "{{ nvidia_smi.stdout_lines }}"

# Added only when missing: if the image already configures NVIDIA's apt source
# under another name, a second copy with a different keyring breaks apt.
- name: Check for the NVIDIA container toolkit
  ansible.builtin.command: dpkg-query -W -f=${Version} nvidia-container-toolkit
  register: nvidia_toolkit
  changed_when: false
  failed_when: false

- name: Install the NVIDIA container toolkit
  when: nvidia_toolkit.rc != 0
  block:
    - name: Add NVIDIA's container toolkit repository
      ansible.builtin.deb822_repository:
        name: nvidia-container-toolkit
        uris: https://nvidia.github.io/libnvidia-container/stable/deb/amd64
        suites: /
        signed_by: https://nvidia.github.io/libnvidia-container/gpgkey

    - name: Install the toolkit packages
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        update_cache: true
