---
all:
  children:
    lab:
      hosts:
        inference-lab:
          # Read from Terraform on every run, so no address is ever committed.
          ansible_host: >-
            {{ lookup('ansible.builtin.pipe',
                      'terraform -chdir=' ~ inventory_dir ~ '/../terraform'
                      ~ ' output -raw public_ip 2>/dev/null || true') }}
          ansible_user: root
          # Same flags as SSH_OPTS in the Makefile. The known_hosts file is
          # per-repo and `make destroy` deletes it, because a rebuild can get a
          # reused address with a new host key.
          ansible_ssh_common_args: >-
            -o IdentityAgent=~/.ssh/proton-pass-agent.sock
            -o IdentityFile={{ inventory_dir }}/../keys/lab.pub
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile={{ inventory_dir }}/../.secrets/known_hosts
            -o StrictHostKeyChecking=accept-new
